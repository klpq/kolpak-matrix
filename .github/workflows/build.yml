name: Build

# Builds the Kolpak desktop app on every push to main (and on pull requests into it, so a
# broken build shows up before it lands). The installers are attached to the run as
# artifacts. No signing, no updater, no release publishing: that comes later.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux
            platform: ubuntu-24.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS
            platform: macos-latest
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup
        with:
          tauri: 'true'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Build desktop app
        shell: bash
        run: pnpm tauri:wry build --no-updater

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kolpak-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
