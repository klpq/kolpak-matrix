name: Build

# Builds the Kolpak desktop app on every push to main (and on pull requests into it, so a
# broken build shows up before it lands). On main, once all three platforms have built, it
# publishes a GitHub release "Kolpak build N" (tag build-N, N = this workflow's run
# number) with every installer attached, marked latest. Pull requests only build.
# No code signing and no auto-updater yet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push replaces a pull request's build; on main every push gets its release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux
            platform: ubuntu-24.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS
            platform: macos-latest
            artifacts: |
              src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup
        with:
          tauri: 'true'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Build desktop app
        shell: bash
        run: pnpm tauri:wry build --no-updater

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kolpak-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: desktop
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kolpak-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: build-${{ github.run_number }}
          TITLE: Kolpak build ${{ github.run_number }}
        run: |
          mapfile -t files < <(find dist -type f | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "No installers to publish" >&2; exit 1; }
          printf 'Publishing %s\n' "${files[@]}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A re-run of this job: replace the files on the release it already made.
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$REPO" \
              --target "$SHA" \
              --title "$TITLE" \
              --notes "Built from ${SHA:0:9} on main. Unsigned: Windows SmartScreen and macOS Gatekeeper will warn before the first start." \
              --generate-notes \
              --latest
          fi
